site: daves-exotic-cars
siteName: Dave's Exotic Cars
contactCollection: inquiries
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
umamiWebsiteId: 29c76126-8d26-4e3b-8aac-ca7033e12da0
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
collections:
  - name: cars
    label: Cars
    description: Inventory listed on the site's showroom.
    path: content/cars
    format: yaml-frontmatter
    view:
      primary: title
      sort: price
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: make
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: model
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: year
        type: number
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: price
        type: number
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: mileage
        type: number
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: images
        type: image
        required: true
        hidden: false
        readonly: false
        isBody: false
        list:
          min: 1
      - name: featured
        type: boolean
        required: false
        default: false
        hidden: false
        readonly: false
        isBody: false
      - name: active
        type: boolean
        required: false
        default: true
        hidden: false
        readonly: false
        isBody: false
      - name: description
        type: rich-text
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: events
    label: Events
    description: Upcoming events shown on the site's events page.
    path: content/events
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: date
        type: date
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: location
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: image
        type: image
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: description
        type: rich-text
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: posts
    label: Posts
    description: Articles shown on the site's blog page.
    path: content/posts
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: date
        type: date
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: heroImage
        type: image
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: body
        type: rich-text
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: inquiries
    label: Inquiries
    description: Submissions from the site's contact form.
    path: content/inquiries
    format: yaml
    fields:
      - name: name
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: email
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: phone
        type: string
        label: Phone
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: carOfInterest
        type: string
        label: Car of Interest
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: message
        type: text
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: true
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
          hidden: false
        - name: open
          label: Open
          kind: needs-you
          hidden: false
        - name: waiting
          label: Waiting on customer
          kind: waiting
          hidden: false
        - name: done
          label: Done
          kind: closed
          hidden: false
        - name: archived
          label: Archived
          kind: closed
          hidden: true
  - name: rsvps
    label: Event RSVPs
    description: Replies to the invitations on the events page.
    path: content/rsvps
    format: yaml
    form: true
    fields:
      - name: fullName
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: mobile
        type: string
        label: Mobile
      - name: eventTitle
        type: string
        label: Event
        required: true
      - name: guests
        type: number
      - name: attending
        type: boolean
        label: I'll be there
      - name: dietaryNotes
        type: text
    workflow:
      states:
        - name: pending
          label: Awaiting reply
          kind: needs-you
        - name: waitlist
          label: Waitlisted
          kind: waiting
        - name: confirmed
          label: Confirmed
          kind: closed
        - name: declined
          label: Declined
          kind: closed
